<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The YouTube Library</title>
<link rel="stylesheet" href="https://unpkg.com/98.css@0.1.25/dist/98.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="desktop">

  <!-- Main Explorer Window -->
  <div class="window" id="explorer">
    <div class="title-bar">
      <div class="title-bar-text" id="windowTitle">The YouTube Library</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <menu role="tablist">
      <menuitem role="tab">File</menuitem>
      <menuitem role="tab">Edit</menuitem>
      <menuitem role="tab">View</menuitem>
      <menuitem role="tab">Help</menuitem>
    </menu>

    <div class="address-bar" id="addressBar">
      <span class="address-label">Address:</span>
      <span id="breadcrumb"></span>
    </div>

    <div class="window-body" id="windowBody">
      <div class="sunken-panel" id="contentsWrapper">
        <div class="contents-pane" id="contentsPane">
          <div class="loading-indicator" id="loadingIndicator">
            <div class="hourglass"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <p class="status-bar-field" id="itemCount"></p>
    </div>
  </div>

  <!-- Video Popup -->
  <div class="window video-popup" id="videoPopup" style="display:none;">
    <div class="title-bar">
      <div class="title-bar-text" id="videoPopupTitle">Video</div>
      <div class="title-bar-controls">
        <button aria-label="Close" id="closeVideo"></button>
      </div>
    </div>
    <div class="window-body video-popup-body">
      <div id="videoContainer"></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
